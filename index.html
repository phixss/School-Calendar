<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in Calendar</title>
    <link rel="stylesheet" href="login.css" />
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>

<body>
<div class="background"></div>
  <div class="container">
    <div class="content">
      <div class="logo-wrapper">
        <a href="aicslogo.png" target="_blank">
          <img src="aicslogo.png" alt="AICS Logo" width="90" height="90">
        </a>
      <div class="logo-text">
        <h1>AICS Calendar</h1>
        <p>Asian Institute of Computer Studies</p>
      </div>
      </div>
    
    <div class="text-sci">
      <h2>Check Out<br><span>this year's schedule and events!</span></h2>

      <p>Be active and updated!</p>

    </div>
    </div>
    <div class="logreg-box">
      <div class="form-box login">
        <form action="#">
          <h2>LOG IN</h2>
          <div class="input-box">
            <span class="icon"><i class='bx bx-envelope'></i></span>
            <input type="email" required>
            <label>Email</label>
          </div>
          <div class="input-box">
            <span class="icon"><i class='bx bx-lock-alt'></i></span>
            <input type="password" required>
            <label>Password</label>
          </div>
          <div class="remember-forgot">
            <label><input type="checkbox"> Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn">Login</button>
          <div class="login-register">
            <p>Don't have an account? <a href="#" class="register-link">Sign-up</a></p>
          </div>
        </form>
      </div>

      <div class="form-box register">
        <form action="#">
          <h2>SIGN UP</h2>
          <div class="input-box">
            <span class="icon"><i class='bx bx-user' ></i></span>
            <input id="inpname" type="text" required>
            <label>Name</label>
          </div>

          <div class="input-box">
            <span class="icon"><i class='bx bx-envelope'></i></span>
            <input id="inpemail" type="email" required>
            <label>Email</label>
          </div>
          <div class="input-box">
            <span class="icon"><i class='bx bx-lock-alt'></i></span>
            <input id="inppassword" type="password" required>
            <label>Password</label>
          </div>

          <div class="remember-forgot">
            <label><input type="checkbox"> I agree to the terms and conditions</label>
          </div>

          <button id="signup" type="submit" class="btn">Sign Up</button>
          
          <div class="login-register">
            <p>Already have an account? <a href="#" class="login-link">Login</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
